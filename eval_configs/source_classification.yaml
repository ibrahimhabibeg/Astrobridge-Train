task:
  name: source_classification
  kwargs:
    active_classes:
      GALAXY: Galaxy
      QSO: Quasar

run:
  responder_type: gemini
  gemini_model: gemini-3.8-flash
  gemini_num_workers: 4
  gemini_temperature: 0.0
  max_tokens: 2048
  fallback_max_tokens: 128
  batch_size: 256
  gpu: A100-80GB
  suffix_tag: source_class
